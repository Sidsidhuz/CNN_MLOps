<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Disease Classifier</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 0; }
        .container { max-width: 720px; margin: 48px auto; background: #111827; padding: 32px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
        h1 { margin-top: 0; }
        label { display: block; margin-top: 16px; margin-bottom: 8px; }
        select, input[type="file"], button { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #1f2937; color: #e2e8f0; }
        button { margin-top: 20px; background: #2563eb; border: none; cursor: pointer; font-weight: 700; }
        button:hover { background: #1d4ed8; }
        .result, .error { margin-top: 24px; padding: 16px; border-radius: 12px; }
        .result { background: #0f5132; }
        .error { background: #7f1d1d; }
        .hint { color: #94a3b8; font-size: 0.95rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Crop Disease Classifier</h1>
        <p class="hint">Select the crop, upload the leaf image, and click Predict.</p>

        <form action="/predict" method="post" enctype="multipart/form-data">
            <label for="crop">Crop</label>
            <select id="crop" name="crop" required>
                {% for crop_name in crop_options %}
                    <option value="{{ crop_name }}" {% if selected_crop == crop_name %}selected{% endif %}>{{ crop_name|capitalize }}</option>
                {% endfor %}
            </select>

            <label for="image">Choose Image</label>
            <input id="image" name="image" type="file" accept="image/*" required>

            <button type="submit">Predict</button>
        </form>

        {% if prediction %}
            <div class="result">
                <strong>Crop:</strong> {{ prediction.crop }}<br>
                <strong>Prediction:</strong> {{ prediction.disease }}<br>
                <strong>Confidence:</strong> {{ "%.2f"|format(prediction.confidence) }}%
            </div>
        {% endif %}

        {% if error %}
            <div class="error">
                <strong>Error:</strong> {{ error }}
            </div>
        {% endif %}
    </div>
</body>
</html>
